services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    # `npm run dev` (scripts/dev.mjs) builds the TS backend (tsc -> dist/) and
    # runs it in the foreground. The backend serves the terminal page (/), the
    # dashboard (/app) and /api/* itself, on its one port, 7861. The host
    # publishes that same backend as both :7861 and :3000, so http://localhost:3000
    # and http://localhost:7861 are the same app, not two. There is no
    # Vite and no proxy: a proxy would make remote clients look like loopback
    # to the backend and bypass its password gate.
    #
    # Inside the container the backend binds 0.0.0.0 (a published port cannot
    # reach a loopback-only listener), so it counts every browser as remote and
    # asks for a password. Set NEUROCLAW_WEB_PASSWORD in your shell or a .env
    # file, or leave it unset and open http://localhost:3000/login with the
    # setup code printed by `docker compose -f docker-compose.dev.yml logs web`.
    # The host side of the port is bound to loopback only.
    # NEUROCLAW_AUTO_UPDATE=0 stops the startup git fetch/pull from touching
    # the bind-mounted working tree.
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:3000:7861"
      - "127.0.0.1:7861:7861"
    environment:
      - NEUROCLAW_WEB_PORT=7861
      - NEUROCLAW_WEB_HOST=0.0.0.0
      - NEUROCLAW_WEB_PASSWORD=${NEUROCLAW_WEB_PASSWORD:-}
      - NEUROCLAW_AUTO_UPDATE=0
    restart: unless-stopped
