services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    # `npm run dev` (scripts/dev.mjs) builds the TS backend (tsc -> dist/) and
    # runs it on 127.0.0.1:7861. The Vite frontend is gone, so nothing listens
    # on the published port 3000 any more.
    # NEUROCLAW_AUTO_UPDATE=0 stops the startup git fetch/pull from touching
    # the bind-mounted working tree.
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
