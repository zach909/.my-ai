<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corona</title>
<!--
  Boot screen, shown the moment the window opens and before the backend is up.

  Previously the window was not created until startNeuroclaw() had resolved,
  which meant roughly fifteen seconds of nothing at all after clicking the
  icon -- no window, no feedback, indistinguishable from the app failing to
  launch. The window now appears immediately with this page and swaps to the
  real app once the server is ready.

  Self-contained: the look is the two local files next to it (ambient.css,
  ambient.js, generated from interface/ambient.ts), no fonts, no server. The
  card and the background paint on the first frame from the stylesheet alone;
  the turning ring joins a moment later, and if the script never runs the page
  is still complete. The ring is the loading animation, so there is no second
  spinner on the page.

  main.js finds #detail to report a startup failure, so keep that id and the
  "detail error" class it sets.
-->
<link rel="stylesheet" href="ambient.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  .wrap { box-sizing: border-box; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { padding: 28px 40px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 440px; }
  .name { font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--nc-ink); }
  .detail { font-size: 13px; color: rgba(248, 237, 233, 0.62); }
  .detail.error { color: #ff9aa8; max-width: 46ch; line-height: 1.5; }
</style>
</head>
<body class="nc-soft">
  <div class="wrap" role="status" aria-live="polite">
    <div class="card nc-glass">
      <div class="name">Corona</div>
      <div class="detail" id="detail">Starting the neural mesh...</div>
    </div>
  </div>
  <script src="ambient.js"></script>
</body>
</html>
