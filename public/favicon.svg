  <title>Neuroclaw</title>
  <defs>
    <!-- Brushed metal: light catches the upper-left and lower-right of the band,
         so the gradient runs across the ring rather than around it. -->
    <linearGradient id="nc-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="18%"  stop-color="#eceeee"/>
      <stop offset="40%"  stop-color="#c2c8c9"/>
      <stop offset="58%"  stop-color="#e8ebeb"/>
      <stop offset="78%"  stop-color="#b4babb"/>
      <stop offset="100%" stop-color="#f4f6f6"/>
    </linearGradient>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1b1b1e"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <!-- Fine directional grain, the brushed finish of the original. -->
    <filter id="nc-brush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="3" seed="7" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="soft">
        <feFuncA type="linear" slope="0.16" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceAlpha" operator="in" result="grainClipped"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="grainClipped"/>
      </feMerge>
    </filter>
  </defs>

