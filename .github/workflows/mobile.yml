name: Mobile apps

# Builds the native apps so no local Android SDK / Xcode is needed.
# Download the results from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neuroclaw-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Build for simulator (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project NeuroClaw.xcodeproj -scheme NeuroClaw \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: neuroclaw-ios-simulator-app
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/NeuroClaw.app
