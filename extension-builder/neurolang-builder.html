<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroLang Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--canvas:#090916;--panel:#0e0e20;--border:#1d1d38;
  --txt:#b0b0d0;--dim:#505078;
  --cn:#00c8ff;--cc:#b04fff;--cs:#00e5a0;--co:#ff7800;--cl:#ffe066;
  --f:'JetBrains Mono','Courier New',monospace;
}
body{font-family:var(--f);background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:12px}
/* TOP */
#bar{height:46px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0}
.logo{font-size:12px;font-weight:600;color:var(--cn);letter-spacing:3px;margin-right:6px;padding-right:10px;border-right:1px solid var(--border)}
.ab{padding:4px 9px;border:1px solid;background:transparent;font-family:var(--f);font-size:9px;cursor:pointer;letter-spacing:.8px;transition:background .12s}
.ab.n{border-color:var(--cn);color:var(--cn)}.ab.n:hover{background:rgba(0,200,255,.1)}
.ab.c{border-color:var(--cc);color:var(--cc)}.ab.c:hover{background:rgba(176,79,255,.1)}
.ab.s{border-color:var(--cs);color:var(--cs)}.ab.s:hover{background:rgba(0,229,160,.1)}
.ab.o{border-color:var(--co);color:var(--co)}.ab.o:hover{background:rgba(255,120,0,.1)}
.ab.l{border-color:var(--cl);color:var(--cl)}.ab.l:hover{background:rgba(255,224,102,.1)}
.sp{flex:1}
.dc{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:9px;padding:0 8px;border-left:1px solid var(--border)}
.dc input{width:32px;background:var(--bg);border:1px solid var(--border);color:var(--txt);font-family:var(--f);font-size:9px;padding:3px 4px;text-align:center;outline:none}
.acb{padding:5px 13px;font-family:var(--f);font-size:9px;cursor:pointer;border:none;letter-spacing:.8px}
.acb.sv{background:var(--border);color:var(--txt)}.acb.sv:hover{background:#252548}
.acb.in{background:var(--cn);color:#000}.acb.in:hover{opacity:.85}
.acb.si{background:var(--cs);color:#000}.acb.si:hover{opacity:.85}
/* LAYOUT */
#main{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
#sb{width:195px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sbox{padding:8px;border-bottom:1px solid var(--border)}
#sbox input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--txt);font-family:var(--f);font-size:10px;padding:5px 6px;outline:none}
#sbox input:focus{border-color:var(--cn)}
#nlist{flex:1;overflow-y:auto;padding:4px}
.nli{padding:5px 7px;font-size:10px;cursor:pointer;border-left:2px solid transparent;margin-bottom:1px;color:var(--dim)}
.nli:hover{background:rgba(255,255,255,.03);color:var(--txt)}
.nli.sel{border-left-color:var(--cn);color:var(--cn)}
.nli-sub{font-size:8px;letter-spacing:.8px;opacity:.5;margin-top:1px}
/* CANVAS */
#cw{flex:1;overflow:hidden;position:relative;background:var(--canvas);background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 0);background-size:26px 26px}
#cv{position:absolute;top:0;left:0;width:6000px;height:6000px;transform-origin:0 0}
#svgl{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
#nodl{position:absolute;top:0;left:0;width:100%;height:100%}
/* NODES */
.nd{position:absolute;width:166px;border:1px solid;background:var(--panel);user-select:none}
.nd.sel-nd{outline:1px solid rgba(255,255,255,.22)}
.nd.ty-neuron{border-color:var(--cn)}.nd.ty-codenet{border-color:var(--cc)}
.nd.ty-netsearch{border-color:var(--cs)}.nd.ty-output{border-color:var(--co)}
.nh{padding:5px 6px;display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(255,255,255,.06);cursor:move}
.nd.ty-neuron .nh{background:rgba(0,200,255,.07)}.nd.ty-codenet .nh{background:rgba(176,79,255,.07)}
.nd.ty-netsearch .nh{background:rgba(0,229,160,.07)}.nd.ty-output .nh{background:rgba(255,120,0,.07)}
.ntag{font-size:7px;letter-spacing:1px;padding:2px 3px;border:1px solid currentColor;flex-shrink:0}
.nd.ty-neuron .ntag{color:var(--cn)}.nd.ty-codenet .ntag{color:var(--cc)}
.nd.ty-netsearch .ntag{color:var(--cs)}.nd.ty-output .ntag{color:var(--co)}
.nn{font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ndel{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.ndel:hover{color:#f44}
.nb{padding:6px 7px;font-size:9px;color:var(--dim);line-height:1.75}
.row{display:flex;justify-content:space-between}
.v{color:var(--txt)}
.ndef{font-size:8px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* PORTS */
.pt{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid;background:var(--panel);top:50%;transform:translateY(-50%);cursor:crosshair;z-index:30;transition:background .1s}
.pt:hover,.pt.hot{background:currentColor}
.ip{left:-6px}.op{right:-6px}
.nd.ty-neuron .pt{border-color:var(--cn)}.nd.ty-codenet .pt{border-color:var(--cc)}
.nd.ty-netsearch .pt{border-color:var(--cs)}.nd.ty-output .pt{border-color:var(--co)}
/* LABEL */
.lbn{position:absolute;background:rgba(255,224,102,.07);border:1px solid var(--cl);color:var(--cl);font-size:11px;padding:3px 8px;cursor:move;user-select:none;min-width:48px;z-index:5}
.lbn.sel-nd{outline:1px solid rgba(255,224,102,.35)}
/* PROPS */
#pr{width:236px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#prh{padding:9px 11px;border-bottom:1px solid var(--border);font-size:8px;letter-spacing:1.5px;color:var(--dim)}
#prb{flex:1;overflow-y:auto;padding:10px 11px}
.pg{margin-bottom:11px}
.pl{display:block;font-size:8px;letter-spacing:.8px;color:var(--dim);margin-bottom:3px}
.pi{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--txt);font-family:var(--f);font-size:10px;padding:4px 6px;outline:none}
.pi:focus{border-color:var(--cn)}
textarea.pi{resize:vertical;min-height:52px;max-height:140px}
select.pi{cursor:pointer}
.no-sel{color:var(--dim);font-size:10px;padding:14px 0;line-height:1.7}
.delbtn{width:100%;padding:5px;background:rgba(255,68,68,.08);border:1px solid #f44;color:#f44;font-family:var(--f);font-size:9px;cursor:pointer;margin-top:6px;letter-spacing:.8px}
.delbtn:hover{background:rgba(255,68,68,.18)}
.pr-sec{font-size:8px;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:10px}
/* SIM */
#simp{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:510px;background:var(--panel);border:1px solid var(--border);display:none;flex-direction:column;max-height:255px;z-index:60;box-shadow:0 6px 40px rgba(0,0,0,.7)}
#simp.vis{display:flex}
#simhdr{padding:6px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:9px;flex-shrink:0;flex-wrap:wrap}
#simhdr select,#simhdr input[type=text]{background:var(--bg);border:1px solid var(--border);color:var(--txt);font-family:var(--f);font-size:9px;padding:3px 5px;outline:none}
#simhdr input[type=number]{background:var(--bg);border:1px solid var(--border);color:var(--txt);font-family:var(--f);font-size:9px;padding:3px;width:38px;text-align:center;outline:none}
.slbl{color:var(--dim);font-size:8px}
#simcl{margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px}
#simrun{background:var(--cs);border:none;color:#000;font-family:var(--f);font-size:9px;padding:4px 11px;cursor:pointer;letter-spacing:.8px;flex-shrink:0}
#simout{flex:1;overflow-y:auto;padding:7px 10px;font-size:9px;line-height:1.9;color:var(--dim);font-family:var(--f)}
.tkh{color:var(--cn);font-weight:600}.pos{color:var(--cs)}.neg{color:var(--co)}
/* scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>
<div id="bar">
  <div class="logo">NEUROLANG</div>
  <button class="ab n" onclick="addNode('neuron')">+ NEURON</button>
  <button class="ab c" onclick="addNode('codenet')">+ CODENET</button>
  <button class="ab s" onclick="addNode('netsearch')">+ NETSEARCH</button>
  <button class="ab o" onclick="addNode('output')">+ OUTPUT</button>
  <button class="ab l" onclick="addLabel()">+ LABEL</button>
  <div class="dc"><span>DIMS</span><input type="number" id="dims-in" value="3" min="1" max="64" onchange="G.dims=+this.value"></div>
  <div class="sp"></div>
  <button class="acb sv" onclick="doSave(false)">SAVE .NL</button>
  <button class="acb in" onclick="doSave(true)">INSTALL Q8</button>
  <button class="acb si" onclick="toggleSim()">▶ SIMULATE</button>
</div>
<div id="main">
  <div id="sb">
    <div id="sbox"><input type="text" id="srch" placeholder="search neurons..." oninput="filterList(this.value)"></div>
    <div id="nlist"></div>
  </div>
  <div id="cw">
    <div id="cv">
      <svg id="svgl" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path id="tmpL" d="" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none"/>
      </svg>
      <div id="nodl"></div>
    </div>
    <div id="simp">
      <div id="simhdr">
        <span style="color:var(--cs);letter-spacing:1.2px;font-size:8px">SIMULATE</span>
        <span class="slbl">INPUT:</span><select id="sim-src"></select>
        <span class="slbl">VECTOR:</span><input type="text" id="sim-vec" value="1.0,0.5,-0.3" style="width:100px">
        <span class="slbl">TICKS:</span><input type="number" id="sim-t" value="4" min="1" max="30">
        <button id="simrun" onclick="runSim()">RUN</button>
        <button id="simcl" onclick="toggleSim()">✕</button>
      </div>
      <div id="simout"><span style="color:var(--dim)">Set input neuron and press RUN</span></div>
    </div>
  </div>
  <div id="pr">
    <div id="prh">PROPERTIES</div>
    <div id="prb"><div class="no-sel">Select a node or connection<br>to edit its properties.</div></div>
  </div>
</div>
<script>
// ═══════════ STATE ═══════════
let G = {
  nodes:[], connections:[], labels:[],
  selected:null,
  pan:{x:120,y:80}, zoom:1.0, dims:3
};
let _uid=0;
const uid=()=>'x'+(++_uid);

const NW=166;
const NH={neuron:96,codenet:68,netsearch:82,output:72};
const COLS={neuron:'#00c8ff',codenet:'#b04fff',netsearch:'#00e5a0',output:'#ff7800'};
const TAGS={neuron:'NEURON',codenet:'CODENET',netsearch:'NETSEARCH',output:'OUTPUT API'};

// ═══════════ COORDS ═══════════
function s2c(sx,sy){
  const r=document.getElementById('cw').getBoundingClientRect();
  return{x:(sx-r.left-G.pan.x)/G.zoom,y:(sy-r.top-G.pan.y)/G.zoom};
}
function portPos(node,side){
  const h=NH[node.type]||80;
  const py=node.y+h/2;
  return side==='i'?{x:node.x,y:py}:{x:node.x+NW,y:py};
}
function bezier(a,b){
  const cp=Math.max(Math.abs(b.x-a.x)*.5,70);
  return`M${a.x} ${a.y}C${a.x+cp} ${a.y} ${b.x-cp} ${b.y} ${b.x} ${b.y}`;
}
function midPt(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

// ═══════════ ADD / DELETE ═══════════
function addNode(type){
  const cw=document.getElementById('cw');
  const cx=(cw.clientWidth/2-G.pan.x)/G.zoom;
  const cy=(cw.clientHeight/2-G.pan.y)/G.zoom;
  const j=()=>(Math.random()-.5)*100;
  const n={
    id:uid(),type,
    name:type.charAt(0).toUpperCase()+type.slice(1)+'_'+_uid,
    x:cx-83+j(),y:cy-44+j(),
    vale:.5,dims:G.dims,definition:'',
    code:'',corpus:'',netPath:'',query:'',
    endpoint:'/api/predict',method:'POST',external:[]
  };
  G.nodes.push(n);
  render();selectItem('node',n.id);
}

function addLabel(){
  const cw=document.getElementById('cw');
  const l={
    id:uid(),text:'Label',
    x:(cw.clientWidth/2-G.pan.x)/G.zoom-40,
    y:(cw.clientHeight/2-G.pan.y)/G.zoom-20
  };
  G.labels.push(l);render();selectItem('label',l.id);
}

function delNode(id){
  G.nodes=G.nodes.filter(n=>n.id!==id);
  G.connections=G.connections.filter(c=>c.fromId!==id&&c.toId!==id);
  if(G.selected?.id===id)G.selected=null;
  render();showProps();
}
function delConn(id){
  G.connections=G.connections.filter(c=>c.id!==id);
  if(G.selected?.id===id)G.selected=null;
  render();showProps();
}
function delLabel(id){
  G.labels=G.labels.filter(l=>l.id!==id);
  if(G.selected?.id===id)G.selected=null;
  render();showProps();
}

// ═══════════ SELECTION ═══════════
function selectItem(kind,id){
  G.selected={kind,id};
  render();showProps();
}
function clearSel(e){
  if(e.target===document.getElementById('cv')||e.target===document.getElementById('svgl')||e.target===document.getElementById('nodl')){
    G.selected=null;render();showProps();
  }
}

// ═══════════ RENDER ═══════════
function render(){
  renderNodes();renderConns();updateList();updateSimSrc();
}

function renderNodes(){
  const layer=document.getElementById('nodl');
  layer.innerHTML='';
  G.labels.forEach(l=>layer.appendChild(makeLabelEl(l)));
  G.nodes.forEach(n=>layer.appendChild(makeNodeEl(n)));
}

function makeNodeEl(n){
  const h=NH[n.type]||80;
  const sel=G.selected?.id===n.id&&G.selected?.kind==='node';
  const el=document.createElement('div');
  el.className=`nd ty-${n.type}${sel?' sel-nd':''}`;
  el.style.cssText=`left:${n.x}px;top:${n.y}px;width:${NW}px`;

  let body='';
  if(n.type==='neuron'){
    body=`<div class="row"><span>vale</span><span class="v">${n.vale}</span></div>
<div class="row"><span>dims</span><span class="v">${n.dims}</span></div>
${n.definition?`<div class="ndef">${n.definition}</div>`:''}`;
  }else if(n.type==='codenet'){
    body=`<div class="row"><span>code</span><span class="v">${n.code?'✓ set':'—'}</span></div>`;
  }else if(n.type==='netsearch'){
    body=`<div class="row"><span>corpus</span><span class="v">${n.corpus?'✓ set':'—'}</span></div>
<div class="row"><span>net</span><span class="v">${n.netPath||'—'}</span></div>`;
  }else if(n.type==='output'){
    body=`<div class="row"><span>${n.method}</span><span class="v" style="font-size:8px">${n.endpoint.slice(0,16)}</span></div>`;
  }

  el.innerHTML=`
<div class="nh">
  <span class="ntag">${TAGS[n.type]}</span>
  <span class="nn">${n.name}</span>
  <button class="ndel">×</button>
</div>
<div class="nb">${body}</div>
<div class="pt ip" data-id="${n.id}" data-side="i"></div>
<div class="pt op" data-id="${n.id}" data-side="o"></div>`;

  el.querySelector('.ndel').onclick=e=>{e.stopPropagation();delNode(n.id);};
  el.querySelectorAll('.pt').forEach(p=>{
    p.onmousedown=e=>{e.stopPropagation();startConn(n.id,p.dataset.side,e);};
    p.onmouseup=e=>{e.stopPropagation();endConn(n.id,p.dataset.side,e);};
  });
  el.querySelector('.nh').onmousedown=e=>startDrag(n,e,false);
  el.onmousedown=e=>{
    if(e.target.classList.contains('pt')||e.target.classList.contains('ndel'))return;
    selectItem('node',n.id);
  };
  return el;
}

function makeLabelEl(l){
  const sel=G.selected?.id===l.id&&G.selected?.kind==='label';
  const el=document.createElement('div');
  el.className=`lbn${sel?' sel-nd':''}`;
  el.style.cssText=`left:${l.x}px;top:${l.y}px`;
  el.textContent=l.text;
  el.onmousedown=e=>{
    e.stopPropagation();
    selectItem('label',l.id);
    startDrag(l,e,true);
  };
  return el;
}

// ═══════════ CONNECTION RENDERING ═══════════
function renderConns(){
  const svg=document.getElementById('svgl');
  // Remove all except defs and tmpL
  [...svg.children].forEach(c=>{
    if(c.id!=='tmpL'&&c.tagName!=='defs')svg.removeChild(c);
  });

  G.connections.forEach(conn=>{
    const fn=G.nodes.find(n=>n.id===conn.fromId);
    const tn=G.nodes.find(n=>n.id===conn.toId);
    if(!fn||!tn)return;
    const fp=portPos(fn,'o'),tp=portPos(tn,'i');
    const d=bezier(fp,tp);
    const mid=midPt(fp,tp);
    const sel=G.selected?.id===conn.id&&G.selected?.kind==='conn';
    const col=COLS[fn.type]||'#6868a0';
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');

    // Hit area
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d);hit.setAttribute('fill','none');
    hit.setAttribute('stroke','transparent');hit.setAttribute('stroke-width','10');
    hit.style.cursor='pointer';hit.style.pointerEvents='stroke';
    hit.onclick=e=>{e.stopPropagation();selectItem('conn',conn.id);};
    g.appendChild(hit);

    // Visible line
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);path.setAttribute('fill','none');
    path.setAttribute('stroke',col);
    path.setAttribute('stroke-width',sel?'2.2':'1.4');
    path.setAttribute('opacity',sel?'1':'.6');
    if(sel)path.setAttribute('filter','url(#glow)');
    path.style.pointerEvents='none';
    g.appendChild(path);

    // Label background
    const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x',mid.x-28);bg.setAttribute('y',mid.y-12);
    bg.setAttribute('width',56);bg.setAttribute('height',13);
    bg.setAttribute('fill','#0e0e20');bg.setAttribute('rx','2');
    g.appendChild(bg);

    // Label text — shows NeuroLang notation
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',mid.x);txt.setAttribute('y',mid.y-2);
    txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size','7.5');
    txt.setAttribute('font-family','JetBrains Mono,monospace');
    txt.setAttribute('fill',sel?col:'#60608a');
    txt.textContent=`*${conn.weight.toFixed(2)}+${conn.bias.toFixed(2)}`;
    g.appendChild(txt);

    svg.insertBefore(g,document.getElementById('tmpL'));
  });
}

// ═══════════ DRAGGING ═══════════
let dragState=null;
function startDrag(obj,e,isLabel){
  if(e.button!==0)return;
  const pos=s2c(e.clientX,e.clientY);
  dragState={obj,offX:pos.x-obj.x,offY:pos.y-obj.y};
  e.preventDefault();e.stopPropagation();
}

// ═══════════ CONNECTION DRAWING ═══════════
let connState=null;
function startConn(id,side,e){
  if(e.button!==0)return;
  connState={fromId:id,fromSide:side};
  e.preventDefault();
}
function endConn(id,side,e){
  if(!connState)return;
  if(id!==connState.fromId){
    let fromId=connState.fromId,toId=id;
    if(connState.fromSide==='i'){fromId=id;toId=connState.fromId;}
    if(!G.connections.find(c=>c.fromId===fromId&&c.toId===toId)){
      G.connections.push({id:uid(),fromId,toId,weight:1.0,bias:0.0});
    }
    render();
  }
  connState=null;
  document.getElementById('tmpL').setAttribute('d','');
}

// ═══════════ PAN / ZOOM ═══════════
let panState=null;
function updateCanvas(){
  document.getElementById('cv').style.transform=`translate(${G.pan.x}px,${G.pan.y}px)scale(${G.zoom})`;
}

document.addEventListener('DOMContentLoaded',()=>{
  const cw=document.getElementById('cw');
  const cv=document.getElementById('cv');

  cw.addEventListener('wheel',e=>{
    e.preventDefault();
    const f=e.deltaY>0?.88:1.14;
    const r=cw.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    G.pan.x=mx-(mx-G.pan.x)*f;
    G.pan.y=my-(my-G.pan.y)*f;
    G.zoom=Math.max(.15,Math.min(3,G.zoom*f));
    updateCanvas();
  },{passive:false});

  cw.addEventListener('mousedown',e=>{
    if(e.button===1||(e.button===0&&e.altKey)){
      panState={sx:e.clientX,sy:e.clientY,px:G.pan.x,py:G.pan.y};
      e.preventDefault();
    }
  });

  document.addEventListener('mousemove',e=>{
    if(panState){
      G.pan.x=panState.px+(e.clientX-panState.sx);
      G.pan.y=panState.py+(e.clientY-panState.sy);
      updateCanvas();return;
    }
    if(dragState){
      const pos=s2c(e.clientX,e.clientY);
      dragState.obj.x=pos.x-dragState.offX;
      dragState.obj.y=pos.y-dragState.offY;
      const el=document.querySelector(`[data-drag="${dragState.obj.id}"]`)||
               document.getElementById('nodl').querySelector('.sel-nd');
      render();return;
    }
    if(connState){
      const fn=G.nodes.find(n=>n.id===connState.fromId);
      if(!fn)return;
      const fp=portPos(fn,connState.fromSide);
      const mp=s2c(e.clientX,e.clientY);
      document.getElementById('tmpL').setAttribute('d',bezier(fp,mp));
    }
  });

  document.addEventListener('mouseup',e=>{
    if(panState){panState=null;return;}
    if(dragState){dragState=null;return;}
    if(connState){connState=null;document.getElementById('tmpL').setAttribute('d','');}
  });

  cv.addEventListener('mousedown',clearSel);
  updateCanvas();
  render();
});

// ═══════════ SIDEBAR LIST ═══════════
function updateList(filter=''){
  const el=document.getElementById('nlist');
  el.innerHTML='';
  const q=filter.toLowerCase();
  G.nodes.forEach(n=>{
    if(q&&!n.name.toLowerCase().includes(q)&&!n.type.includes(q))return;
    const d=document.createElement('div');
    d.className='nli'+(G.selected?.id===n.id?' sel':'');
    d.innerHTML=`<span>${n.name}</span><div class="nli-sub">${n.type.toUpperCase()}</div>`;
    d.onclick=()=>{selectItem('node',n.id);scrollToNode(n);};
    el.appendChild(d);
  });
}
function filterList(v){updateList(v);}

function scrollToNode(n){
  const cw=document.getElementById('cw');
  G.pan.x=cw.clientWidth/2-n.x*G.zoom-83*G.zoom;
  G.pan.y=cw.clientHeight/2-n.y*G.zoom-44*G.zoom;
  updateCanvas();
}

// ═══════════ PROPERTIES ═══════════
function showProps(){
  const body=document.getElementById('prb');
  const s=G.selected;
  if(!s){body.innerHTML='<div class="no-sel">Select a node or connection<br>to edit its properties.</div>';return;}

  if(s.kind==='node'){
    const n=G.nodes.find(x=>x.id===s.id);
    if(!n)return;
    let html=`<div class="pr-sec">${n.type.toUpperCase()} NODE</div>`;
    html+=pg('NAME','text',n.name,'name');
    if(n.type==='neuron'){
      html+=pg('VALE (0–1)','number',n.vale,'vale','0','1','0.01');
      html+=pg('DIMS','number',n.dims,'dims','1','64','1');
      html+=pg('DEFINITION','textarea',n.definition,'definition');
    }else if(n.type==='codenet'){
      html+=pg('CODE','textarea',n.code,'code');
    }else if(n.type==='netsearch'){
      html+=pg('CORPUS','textarea',n.corpus,'corpus');
      html+=pg('QUERY','text',n.query,'query');
      html+=pg('NET PATH','text',n.netPath,'netPath');
    }else if(n.type==='output'){
      html+=`<div class="pg"><label class="pl">METHOD</label><select class="pi" onchange="setProp('method',this.value)"><option${n.method==='GET'?' selected':''}>GET</option><option${n.method==='POST'?' selected':''}>POST</option></select></div>`;
      html+=pg('ENDPOINT','text',n.endpoint,'endpoint');
    }
    html+=`<button class="delbtn" onclick="delNode('${n.id}')">DELETE NODE</button>`;
    body.innerHTML=html;

  }else if(s.kind==='conn'){
    const c=G.connections.find(x=>x.id===s.id);
    if(!c)return;
    const fn=G.nodes.find(n=>n.id===c.fromId);
    const tn=G.nodes.find(n=>n.id===c.toId);
    let html='<div class="pr-sec">CONNECTION</div>';
    html+=roField('FROM',fn?.name||c.fromId);
    html+=roField('TO',tn?.name||c.toId);
    html+=pgConn('WEIGHT','number',c.weight,'weight','−10','10','0.01');
    html+=pgConn('BIAS','number',c.bias,'bias','−10','10','0.01');
    html+=`<button class="delbtn" onclick="delConn('${c.id}')">DELETE CONNECTION</button>`;
    body.innerHTML=html;

  }else if(s.kind==='label'){
    const l=G.labels.find(x=>x.id===s.id);
    if(!l)return;
    body.innerHTML=`<div class="pr-sec">LABEL</div>
<div class="pg"><label class="pl">TEXT</label>
<input class="pi" type="text" value="${escH(l.text)}" oninput="setLblText(this.value)">
</div>
<button class="delbtn" onclick="delLabel('${l.id}')">DELETE LABEL</button>`;
  }
}

function pg(label,type,val,key,min,max,step){
  const extra=min!==undefined?`min="${min}" max="${max}" step="${step}"`:'';
  if(type==='textarea')
    return`<div class="pg"><label class="pl">${label}</label><textarea class="pi" oninput="setProp('${key}',this.value)">${escH(val)}</textarea></div>`;
  return`<div class="pg"><label class="pl">${label}</label><input class="pi" type="${type}" value="${escH(String(val))}" ${extra} oninput="setProp('${key}',this.value)"></div>`;
}
function pgConn(label,type,val,key,min,max,step){
  return`<div class="pg"><label class="pl">${label}</label><input class="pi" type="${type}" value="${val}" min="${min}" max="${max}" step="${step}" oninput="setConnProp('${key}',+this.value)"></div>`;
}
function roField(label,val){
  return`<div class="pg"><label class="pl">${label}</label><div style="font-size:10px;color:var(--txt);padding:4px 0">${escH(val)}</div></div>`;
}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function setProp(key,val){
  const n=G.nodes.find(x=>x.id===G.selected?.id);
  if(!n)return;
  if(key==='vale'||key==='dims')val=+val;
  n[key]=val;
  render();
}
function setConnProp(key,val){
  const c=G.connections.find(x=>x.id===G.selected?.id);
  if(!c)return;
  c[key]=val;renderConns();
}
function setLblText(val){
  const l=G.labels.find(x=>x.id===G.selected?.id);
  if(l){l.text=val;render();}
}

// ═══════════ SIMULATE ═══════════
function updateSimSrc(){
  const sel=document.getElementById('sim-src');
  if(!sel)return;
  const prev=sel.value;
  sel.innerHTML='';
  G.nodes.filter(n=>n.type==='neuron').forEach(n=>{
    const o=document.createElement('option');
    o.value=n.id;o.textContent=n.name;
    if(n.id===prev)o.selected=true;
    sel.appendChild(o);
  });
}

function toggleSim(){
  const p=document.getElementById('simp');
  p.classList.toggle('vis');
  updateSimSrc();
}

function runSim(){
  const neurons=G.nodes.filter(n=>n.type==='neuron');
  if(!neurons.length){document.getElementById('simout').innerHTML='<span style="color:#f44">No neurons in graph.</span>';return;}
  const srcId=document.getElementById('sim-src').value;
  const dims=G.dims;
  const ticks=Math.min(+document.getElementById('sim-t').value,30);
  let extVec=(document.getElementById('sim-vec').value).split(',').map(s=>parseFloat(s.trim())||0);
  while(extVec.length<dims)extVec.push(0);

  let states={};
  neurons.forEach(n=>{states[n.id]=new Array(dims).fill(0);});

  let html='';
  for(let t=1;t<=ticks;t++){
    const nxt={};
    neurons.forEach(n=>{
      let raw=n.id===srcId?[...extVec]:new Array(dims).fill(0);
      neurons.forEach(other=>{
        if(other.id===n.id)return;
        const c=G.connections.find(x=>x.fromId===other.id&&x.toId===n.id);
        const w=c?c.weight:1.0,b=c?c.bias:0.0;
        for(let d=0;d<dims;d++)raw[d]+=states[other.id][d]*w+b;
      });
      const vale=n.vale??0.5;
      nxt[n.id]=raw.map((r,d)=>vale*states[n.id][d]+(1-vale)*Math.tanh(r));
    });
    states=nxt;
    html+=`<div class="tkh">=== TICK ${String(t).padStart(3)} ===</div>`;
    neurons.forEach(n=>{
      const vec=states[n.id].map(v=>{
        const s=(v>=0?'+':'')+v.toFixed(4);
        return v>0.001?`<span class="pos">${s}</span>`:v<-0.001?`<span class="neg">${s}</span>`:s;
      }).join('  ');
      html+=`<div>&nbsp;&nbsp;${n.name.padEnd(16,'&nbsp;')} = [${vec}]</div>`;
    });
  }
  document.getElementById('simout').innerHTML=html;
}

// ═══════════ SAVE / INSTALL ═══════════
function doSave(quantize){
  const q=v=>quantize?(Math.round(v*100)/100).toFixed(2):String(v);
  let L=[];
  if(quantize){
    L.push('# ═══════════════════════════════════════════');
    L.push('# NeuroLang — QUANTIZED BUILD (Q8)');
    L.push('# Weights rounded to 2 d.p. for edge deployment');
    L.push('# Designed for Raspberry Pi 5 / embedded runtime');
    L.push('# ═══════════════════════════════════════════');
    L.push('');
  }
  L.push(`dims = ${G.dims}`);L.push('');

  const neurons=G.nodes.filter(n=>n.type==='neuron');
  neurons.forEach(n=>L.push(`name="${n.name}"`));
  L.push('');

  neurons.forEach(n=>{
    L.push(`"${n.name}"@vale="${q(n.vale)}"`);
    if(n.definition)L.push(`"${n.name}"@definishon="${n.definition}"`);
  });
  L.push('');

  // Connections
  neurons.forEach(target=>{
    G.connections.filter(c=>c.toId===target.id).forEach(c=>{
      const fn=G.nodes.find(n=>n.id===c.fromId);
      if(fn?.type==='neuron')
        L.push(`"${target.name}"@connections=".${fn.name}/state"*${q(c.weight)}+${q(c.bias)}`);
    });
  });
  L.push('');

  // CodeNets
  G.nodes.filter(n=>n.type==='codenet').forEach(n=>{
    L.push(`code@name="${n.name}"`);
    if(n.code)L.push(`"${n.name}"@code="${n.code.replace(/\n/g,' ')}"`);
    L.push('');
  });

  // NetSearch
  G.nodes.filter(n=>n.type==='netsearch').forEach(n=>{
    L.push(`"netsearch"@name="${n.name}"`);
    if(n.corpus)L.push(`"netsearch"@corpus="${n.corpus.replace(/\n/g,' ')}"`);
    if(n.query)L.push(`"netsearch"@query="${n.query}"`);
    if(n.netPath)L.push(`"netsearch"@net="${n.netPath}"`);
    L.push('');
  });

  // Output layers
  G.nodes.filter(n=>n.type==='output').forEach(n=>{
    const srcIds=G.connections.filter(c=>c.toId===n.id).map(c=>c.fromId);
    const srcNames=srcIds.map(id=>G.nodes.find(x=>x.id===id)?.name).filter(Boolean);
    L.push(`# OUTPUT LAYER ─ "${n.name}"`);
    L.push(`# API: ${n.method} ${n.endpoint}`);
    L.push(`# feeds from: ${srcNames.join(', ')||'(none connected)'}`);
    L.push(`# response: { "states": { "neuron_name": [d0, d1, ...] } }`);
    L.push('');
  });

  // Labels as comments
  G.labels.forEach(l=>{L.push(`# [label] ${l.text}`);});

  const blob=new Blob([L.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=quantize?'model.q8.nl':'model.nl';
  a.click();
}
</script>
